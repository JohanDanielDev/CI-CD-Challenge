services:
  nginx-proxy:
    depends_on: !override []
    ports: !override
      - "${APP_PORT:?Set APP_PORT}:80"
    volumes: !override
      - ./nginx/bluegreen.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-movie-api-blue}
      UI_UPSTREAM: ${UI_UPSTREAM:-movie-ui-blue}
      NGINX_ENVSUBST_FILTER: "^(API_UPSTREAM|UI_UPSTREAM)"

volumes:
  movie_data:
    name: ${MONGO_VOLUME_NAME:?Set MONGO_VOLUME_NAME}
